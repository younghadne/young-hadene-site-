services:
  - type: web
    name: young-hadene-site
    runtime: node
    repo: https://github.com/younghadne/young-hadene-site-.git
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        value: https://younghadne.ca
      - key: GROQ_API_KEY
        sync: false
